name: POE2 Currency Flip Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/scan.yml"
      - "pyproject.toml"

concurrency:
  group: poe2-currency-flip-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: pytest

      - name: Run scanner
        env:
          POE2_SCOUT_USER_AGENT: "POE2CurrencyFlip/0.1 (contact: your-email@example.com)"
        run: |
          set +e
          python -m src.main
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "Scanner failed. See reports/latest.md for HTTP status, Content-Type, error summary, and API discovery phase. No environment variables are printed."
          fi
          echo "===== reports/latest.md ====="
          test -f reports/latest.md && cat reports/latest.md || true
          echo "===== raw files ====="
          find reports/raw -maxdepth 1 -type f -printf "%f\n" 2>/dev/null || true
          echo "===== unmapped ====="
          test -f reports/unmapped-currencies.md && sed -n '1,240p' reports/unmapped-currencies.md || true
          exit "$code"

      - name: Write Step Summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reports/latest.md was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poe2-currency-flip-reports
          path: |
            reports/**
            docs/api-contract.md
          retention-days: 14
