name: POE2 Currency Flip Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"
  push:
    branches:
      - codex/poe2-currency-flip
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/scan.yml"
      - "pyproject.toml"

concurrency:
  group: poe2-currency-flip-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: pytest

      - name: Read previous market status
        run: |
          set +e
          git fetch origin market-feed --depth=1
          git show FETCH_HEAD:status.json > "$RUNNER_TEMP/previous_market_status.json" 2>/dev/null || true
          test -s "$RUNNER_TEMP/previous_market_status.json" || echo "{}" > "$RUNNER_TEMP/previous_market_status.json"

      - name: Run scanner
        env:
          POE2_SCOUT_USER_AGENT: "POE2CurrencyFlip/0.1 (contact: your-email@example.com)"
          PREVIOUS_MARKET_STATUS: ${{ runner.temp }}/previous_market_status.json
        run: |
          set +e
          python -m src.main
          code=$?
          echo "$code" > "$RUNNER_TEMP/scan_exit_code"
          if [ "$code" -ne 0 ]; then
            echo "Scanner failed. See reports/latest.md for HTTP status, Content-Type, error summary, and API discovery phase. No environment variables are printed."
          fi
          echo "===== reports/latest.md ====="
          test -f reports/latest.md && cat reports/latest.md || true
          echo "===== raw files ====="
          find reports/raw -maxdepth 1 -type f -printf "%f\n" 2>/dev/null || true
          echo "===== unmapped ====="
          test -f reports/unmapped-currencies.md && sed -n '1,240p' reports/unmapped-currencies.md || true
          exit 0

      - name: Write Step Summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reports/latest.md was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poe2-currency-flip-reports
          path: |
            reports/**
            docs/api-contract.md
          retention-days: 14

      - name: Publish market feed
        if: always()
        run: |
          set -euo pipefail
          test -f reports/public/latest.md
          test -f reports/public/latest.json
          test -f reports/public/status.json

          publish_dir="$(mktemp -d)"
          cp reports/public/latest.md "$publish_dir/latest.md"
          cp reports/public/latest.json "$publish_dir/latest.json"
          cp reports/public/status.json "$publish_dir/status.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git clean -fdx

          if git ls-remote --exit-code --heads origin market-feed >/dev/null 2>&1; then
            git fetch origin market-feed
            git checkout market-feed
            git reset --hard origin/market-feed
          else
            git checkout --orphan market-feed
            git rm -rf . >/dev/null 2>&1 || true
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -path './.git' \
            ! -path './.git/*' \
            -exec rm -rf {} +
          cp "$publish_dir/latest.md" latest.md
          cp "$publish_dir/latest.json" latest.json
          cp "$publish_dir/status.json" status.json
          git add latest.md latest.json status.json

          if git diff --cached --quiet; then
            echo "market-feed unchanged"
          else
            timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git commit -m "chore: update market feed $timestamp"
            git push origin HEAD:market-feed
          fi

      - name: Fail if scanner failed
        if: always()
        run: |
          code="$(cat "$RUNNER_TEMP/scan_exit_code" 2>/dev/null || echo 1)"
          exit "$code"
