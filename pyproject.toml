[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poe2-currency-flip"
version = "0.1.0"
description = "POE2 Scout historical currency path candidate scanner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
poe2-currency-flip = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src"]
